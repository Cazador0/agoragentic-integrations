services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: backline
      POSTGRES_PASSWORD: backline
      POSTGRES_DB: backline
    ports: ["5432:5432"]
    volumes:
      - backline-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backline"]
      interval: 5s
      retries: 10

volumes:
  backline-pg:
